<html lang="zh-CN">

  <style>

    .clue-panel{width:min(820px,100%);margin:0 auto 14px;padding:14px 16px;border:1px solid #f0cf72;border-radius:18px;background:#fff9e9;color:#44375f}.clue-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.clue-head b{font-size:18px}.clue-count{color:#7b6191;font-size:14px}.clue-list{display:grid;gap:9px;margin-top:10px}.clue-item{width:100%;border:1px solid #ead99d;border-radius:13px;background:#fff;padding:9px}.clue-pair-side{display:block;padding:7px 6px;border-radius:8px;background:#f7f3ff;color:#382d58;font-size:16px;line-height:1.35;font-weight:800;text-align:center;overflow-wrap:anywhere;text-wrap:balance}.clue-arrow{display:block;height:22px;color:#8a6820;font-size:19px;line-height:22px;font-weight:900;text-align:center}.clue-item.completed{background:#eafaf3;border-color:#8dd9bc}.clue-item.completed .clue-pair-side{background:#dff7ed;color:#23644d}.hint-btn{width:100%;margin-top:10px;border:1px solid #dfbd50;background:linear-gradient(135deg,#ffe79a,#ffd166);color:#3e3160;border-radius:12px;padding:9px 6px;font-size:14px;white-space:nowrap;font-weight:800;cursor:pointer}.hint-btn:disabled{background:#eee9db;border-color:#ddd4bc;color:#948b79;cursor:not-allowed}.memory-card.hint-preview{animation:hintPulse .65s ease-in-out 2}.memory-card.hint-preview .front{border-color:#ffd457;box-shadow:0 0 0 4px #ffd857,0 0 28px #ffd857bb}.memory-card.hint-position .back{border-color:#ffd457;box-shadow:0 0 0 4px #ffd857,0 0 25px #ffd857aa}.memory-card.hint-position .back::after{content:attr(data-hint-label);position:absolute;right:7px;top:7px;padding:3px 6px;border-radius:999px;background:#ffd457;color:#443269;font-size:11px;font-weight:900;letter-spacing:0;text-shadow:none}@keyframes hintPulse{50%{transform:scale(1.045)}}
    dialog{border:0;border-radius:24px;padding:0;box-shadow:0 30px 90px #251f4a55;max-width:min(540px,92vw);width:100%}dialog::backdrop{background:#221b4770;backdrop-filter:blur(3px)}.modal{padding:28px}.modal h2{margin-top:0}.result-score{text-align:center;font-size:60px;font-weight:900;color:var(--primary)}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.result-grid div{text-align:center;background:#f6f3ff;padding:14px 6px;border-radius:14px}.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}.secondary{border:1px solid #ddd5f5;background:#fff;border-radius:14px;padding:12px 18px;cursor:pointer}#reportDialog{max-width:min(760px,94vw)}.report-section-title{font-size:17px;margin:20px 0 11px}.difficulty-chart{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:17px;background:#f7f5ff;border:1px solid #e8e2fb;border-radius:18px}.difficulty-column{min-width:0;text-align:center}.bar-value{height:30px;font-weight:800;color:var(--ink)}.bar-track{height:138px;display:flex;align-items:flex-end;margin:0 auto 10px;width:min(78px,75%);background:#ebe7f7;border-radius:12px 12px 7px 7px;overflow:hidden}.bar-fill{width:100%;min-height:0;border-radius:12px 12px 5px 5px;transition:height .45s ease}.bar-fill.basic{background:linear-gradient(#63d6ad,#35b786)}.bar-fill.advanced{background:linear-gradient(#8f7df2,#7357e8)}.bar-fill.challenge{background:linear-gradient(#ffc66f,#f29a38)}.bar-label{display:block}.bar-detail{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.4}.report-list{max-height:260px;overflow:auto}.history{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid #eee}.setting{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,30px);background:#27213f;color:#fff;padding:12px 18px;border-radius:13px;opacity:0;pointer-events:none;transition:.3s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:1400px) and (min-height:900px){body{font-size:18px}.app{padding-top:36px}.home-grid{min-height:660px}.panel{padding:36px}.hero{display:flex;flex-direction:column;justify-content:center}.side-card{display:flex;flex-direction:column;justify-content:center}.choice{min-width:122px;font-size:18px}.primary,.secondary,.icon-btn{font-size:18px}.game{grid-template-columns:230px minmax(0,760px) 230px;grid-template-rows:auto auto auto 1fr;justify-content:center;align-items:start;column-gap:28px;row-gap:14px;min-height:min(920px,calc(100vh - 72px));padding:26px}.game-head{display:contents}.game .game-nav{grid-column:3;grid-row:1;align-items:stretch;flex-direction:column}.game .game-nav .secondary,.game .game-nav .icon-btn{width:100%}.metrics{grid-column:3;grid-row:2;flex-direction:column;align-items:stretch}.pill{justify-content:space-between}.game-info{grid-column:3;grid-row:3;width:100%;margin:0;padding:18px 16px;font-size:15px;align-items:flex-start;flex-direction:column}.legend{text-align:left;line-height:1.5}.clue-panel{grid-column:1;grid-row:1 / span 4;width:100%;margin:0;padding:14px}.clue-head{align-items:flex-start;flex-direction:column}.clue-list{gap:7px}.clue-item{font-size:14px;padding:8px 10px}.board{grid-column:2;grid-row:1 / span 4;width:min(760px,calc(100vh - 240px),100%)}.board[data-size="3"]{width:min(660px,calc(100vh - 240px),100%)}.board[data-size="4"]{width:min(720px,calc(100vh - 240px),100%)}.game-actions{grid-column:3;grid-row:4;margin-top:0}.game-actions .secondary{width:100%}dialog{max-width:620px;border-radius:28px}.modal{padding:36px}.modal h2{font-size:30px}.setting{margin:24px 0}.setting input[type="checkbox"]{width:26px;height:26px}.setting select{min-width:150px;padding:10px 14px;border:1px solid #d8d0ef;border-radius:12px}.result-score{font-size:76px}.result-grid{gap:14px;margin:26px 0}.result-grid div{padding:20px 8px}.modal-actions{margin-top:26px}#reportDialog{max-width:900px}.difficulty-chart{gap:20px;padding:22px}.bar-track{height:180px}.bar-detail{font-size:15px}.report-list{max-height:320px}.history{padding:14px 4px}}
    @media(max-width:720px){button:not(.memory-card),select{min-height:44px}.app{width:min(94vw,680px);padding-top:20px}.home-grid{grid-template-columns:1fr}.panel{padding:18px}.game{padding:14px}.board,.board[data-size="3"],.board[data-size="4"]{width:100%;gap:8px;padding:10px}.game-head{align-items:flex-start;flex-direction:column}.game-info{align-items:flex-start;flex-direction:column}.legend{text-align:left}.face{border-radius:11px}.card-label{left:4px;top:4px;padding:1px 4px}.card-content{font-size:clamp(13px,4vw,20px)}.board[data-size="4"] .card-content{font-size:clamp(11px,3.1vw,16px)}.board[data-size="5"] .card-content{font-size:clamp(9px,2.6vw,13px)}.difficulty-chart{gap:7px;padding:11px 8px}.bar-track{height:105px;width:min(58px,78%)}.bar-detail{font-size:11px}}

<body>
<main class="app">
  <header class="top" id="siteHeader"><div class="brand"><h1>🏛️ 历史对对碰</h1><p>串联时间，理解历史</p></div><button class="icon-btn" id="settingsBtn">⚙️ 设置</button></header>
  <section id="home" class="home-grid">
    <article class="panel hero"><h2>翻开线索，串联历史！</h2><p>匹配时间与事件，辨认事件与影响。<br>用高频考点串起中国史与世界史。</p><div class="label">历史难度</div><div class="choices" id="levels"><button class="choice active" data-value="basic" aria-pressed="true">🌱 基础</button><button class="choice" data-value="advanced" aria-pressed="false">🌿 进阶</button><button class="choice" data-value="challenge" aria-pressed="false">🚀 挑战</button></div><div class="label">棋盘规模</div><div class="choices" id="sizes"><button class="choice active" data-value="3" aria-pressed="true">3 × 3</button><button class="choice" data-value="4" aria-pressed="false">4 × 4</button><button class="choice" data-value="5" aria-pressed="false">5 × 5</button></div><button class="primary" id="startBtn">开始挑战 →</button></article>
    <aside class="panel side-card"><h3>📊 我的成长</h3><div class="stats"><div class="stat"><span class="muted">挑战次数</span><b id="totalGames">0</b></div><div class="stat"><span class="muted">平均得分</span><b id="averageScore">—</b></div><div class="stat"><span class="muted">最佳成绩</span><b id="bestScore">—</b></div><div class="stat"><span class="muted">连续打卡</span><b id="streak">0 天</b></div></div><button class="secondary" id="reportBtn" style="margin-top:14px">查看成长报告</button><div class="daily"><b>☀️ 每日挑战</b><div class="muted" id="dailyText">今天的固定题组正在等你</div><button class="primary" id="dailyBtn">开始今日挑战</button></div></aside>
  </section>
  <section id="game" class="game"><div class="game-head"><div class="game-nav" id="gameNav"><button class="secondary" id="backBtn">← 返回主页</button></div><div class="metrics"><span class="pill">⏱️ <b id="timer">00:00</b></span><span class="pill">👆 翻牌 <b id="moves">0</b></span><span class="pill">✅ 配对 <b id="pairs">0/0</b></span></div></div><div class="game-info"><div><b id="gameName">🌱 基础训练</b><span class="muted" id="gameDetail">翻开卡片开始游戏</span></div><div class="legend">将相关的历史线索正确配对</div></div><aside class="clue-panel" id="cluePanel" aria-label="配对线索"><div class="clue-head"><b>💡 配对线索</b><span class="clue-count" id="clueCount"></span></div><div class="clue-list" id="clueList"></div><button class="hint-btn" id="hintBtn" type="button">提示一张卡片</button></aside><div class="board" id="board" aria-label="历史高频考点翻牌棋盘"></div><div class="game-actions"><button class="secondary" id="restartBtn">重新开始</button></div></section>
</main>
<dialog id="resultDialog"><div class="modal"><h2>🎉 挑战完成！</h2><div id="title" class="muted" style="text-align:center"></div><div class="result-score" id="finalScore">0</div><div class="result-grid"><div>翻牌<br><b id="finalMoves"></b></div><div>用时<br><b id="finalTime"></b></div><div>纪录<br><b id="recordText"></b></div></div><div class="modal-actions"><button class="secondary" onclick="resultDialog.close();goHome()">回到主页</button><button class="primary" onclick="resultDialog.close();startGame()">再玩一次</button></div></div></dialog>
<dialog id="reportDialog"><div class="modal"><h2>📈 成长报告</h2><p id="reportSummary" class="muted"></p><h3 class="report-section-title">各难度表现</h3><div id="difficultyChart" class="difficulty-chart" role="group" aria-label="基础、进阶和挑战难度的平均得分柱状图"></div><h3 class="report-section-title">最近记录</h3><div id="historyList" class="report-list"></div><div class="modal-actions"><button class="primary" onclick="reportDialog.close()">知道了</button></div></div></dialog>
<dialog id="settingsDialog"><div class="modal"><h2>⚙️ 设置</h2><label class="setting"><span>游戏音效</span><input type="checkbox" id="soundToggle" checked></label><label class="setting"><span>翻牌失败停留</span><select id="delaySelect"><option value="650">较快</option><option value="900" selected>标准</option><option value="1200">较慢</option></select></label><button class="secondary" id="resetData">清除本地记录</button><div class="modal-actions"><button class="primary" id="saveSettings">保存</button></div></div></dialog>
<div class="toast" id="toast"></div>
<script>

  function seeded(seed){let x=seed;return()=>((x=Math.imul(48271,x)%2147483647)&2147483647)/2147483647}function shuffle(a,r=Math.random){for(let i=a.length-1;i;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function selectPairs(group,count,rng=Math.random){const selected=[],usedText=new Set(),usedType=new Map(),pool=shuffle([...group],rng),types=new Set(group.map(pair=>pair[2])).size,maxPerType=Math.max(1,Math.ceil(count/types));for(let limit=1;limit<=maxPerType;limit++){for(const pair of pool){if(selected.includes(pair)||(usedType.get(pair[2])||0)>=limit)continue;const normalized=pair.slice(0,2).map(text=>String(text).replace(/\s+/g,"").toLowerCase());if(normalized.some(text=>usedText.has(text)))continue;selected.push(pair);normalized.forEach(text=>usedText.add(text));usedType.set(pair[2],(usedType.get(pair[2])||0)+1);if(selected.length===count)return selected}}return selected}
