  <style>

    .game{display:none;background:#e7e0ff;border:2px solid #cfc2ff;border-radius:30px;padding:22px;box-shadow:var(--shadow)}.game-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.metrics{display:flex;gap:9px;flex-wrap:wrap}.pill{background:#fff;color:#29213f;border:1px solid #ded6f8;padding:9px 13px;border-radius:13px;box-shadow:0 5px 17px #493a8718}.game-info{width:min(760px,100%);margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;padding:13px 16px;border-radius:17px;border:1px solid #d5ccf5}.game-info b{display:block;font-size:18px}.game-info span{display:block;margin-top:3px}.legend{color:#4d3a93;font-weight:700;text-align:right}.board{display:grid;gap:12px;margin:auto;width:min(760px,100%);padding:20px;background:linear-gradient(145deg,#30245f,#453782);border:3px solid #fff;border-radius:25px;box-shadow:inset 0 0 0 1px #6659a8,0 16px 35px #30245f35;perspective:1000px}.memory-card{display:block;position:relative;min-width:0;width:100%;border:0;background:transparent;aspect-ratio:1;cursor:pointer;perspective:900px;padding:0}.memory-card .inner{display:block;width:100%;height:100%;position:relative;transition:transform .48s;transform-style:preserve-3d}.memory-card.flipped .inner,.memory-card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:17px;backface-visibility:hidden;box-shadow:0 8px 20px #17112f55;overflow:hidden}.back{display:flex;flex-direction:column;justify-content:center;gap:2px;color:#fff;font-size:clamp(25px,4vw,42px);background:linear-gradient(145deg,#7659ed,#aa91ff);border:2px solid #cbbfff;text-shadow:0 2px 8px #35247466}.back small{font-size:clamp(9px,1.2vw,13px);font-weight:700;letter-spacing:.12em;opacity:.9}.front{transform:rotateY(180deg);background:#fffdf8;color:#241d3c;padding:10px 7px 7px;text-align:center;font-weight:800;border:3px solid #ffcf71}.card-label{position:absolute;left:7px;top:6px;padding:2px 6px;border-radius:999px;background:#eee8ff;color:#5f48b4;font-size:clamp(8px,1vw,11px);font-weight:700}.card-content{display:block;max-width:100%;padding-top:14px;font-size:20px;line-height:1.28;word-break:keep-all;overflow-wrap:normal;text-wrap:balance}.board[data-size="4"] .card-content{font-size:16px}.board[data-size="5"] .card-content{font-size:13px;line-height:1.22}.card-content.long{font-size:.86em}.card-content.very-long{font-size:.74em;line-height:1.18}.vector-letter{position:relative;display:inline-block;min-width:.72em;padding-top:.16em;font-family:Georgia,"Times New Roman",serif;font-style:italic}.vector-letter::before{content:"→";position:absolute;left:50%;top:-.5em;transform:translateX(-50%) scaleX(.72);font-family:Arial,sans-serif;font-size:.72em;font-style:normal;font-weight:700;line-height:1}.matched .front{border-color:#45c899;background:#edfff8;color:#146448}.matched .card-label{background:#d2f7e9;color:#137558}.lucky .front{border-color:#ffc75d;background:#fff8d9;color:#8c5b00}.game-actions{text-align:center;margin-top:18px}
    dialog{border:0;border-radius:24px;padding:0;box-shadow:0 30px 90px #251f4a55;max-width:min(470px,92vw);width:100%}dialog::backdrop{background:#221b4770;backdrop-filter:blur(3px)}.modal{padding:25px}.modal h2{margin-top:0}.result-score{text-align:center;font-size:54px;font-weight:900;color:var(--primary)}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.result-grid div{text-align:center;background:#f6f3ff;padding:12px 5px;border-radius:14px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.secondary{border:1px solid #ddd5f5;background:#fff;border-radius:14px;padding:11px 16px;cursor:pointer}#reportDialog{max-width:min(680px,94vw)}.report-section-title{font-size:16px;margin:18px 0 10px}.difficulty-chart{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:15px;background:#f7f5ff;border:1px solid #e8e2fb;border-radius:18px}.difficulty-column{min-width:0;text-align:center}.bar-value{height:28px;font-weight:800;color:var(--ink)}.bar-track{height:128px;display:flex;align-items:flex-end;margin:0 auto 9px;width:min(74px,75%);background:#ebe7f7;border-radius:12px 12px 7px 7px;overflow:hidden}.bar-fill{width:100%;min-height:0;border-radius:12px 12px 5px 5px;transition:height .45s ease}.bar-fill.basic{background:linear-gradient(#63d6ad,#35b786)}.bar-fill.advanced{background:linear-gradient(#8f7df2,#7357e8)}.bar-fill.challenge{background:linear-gradient(#ffc66f,#f29a38)}.bar-label{display:block}.bar-detail{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.4}.report-list{max-height:220px;overflow:auto}.history{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid #eee}.setting{display:flex;justify-content:space-between;align-items:center;margin:16px 0}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:#27213f;color:#fff;padding:11px 17px;border-radius:13px;opacity:0;pointer-events:none;transition:.3s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:720px){.home-grid{grid-template-columns:1fr}.panel{padding:18px}.game{padding:14px}.board{gap:8px;padding:10px}.game-head{align-items:flex-start;flex-direction:column}.game-info{align-items:flex-start;flex-direction:column}.legend{text-align:left}.face{border-radius:11px}.card-label{left:4px;top:4px;padding:1px 4px}.difficulty-chart{gap:7px;padding:11px 8px}.bar-track{height:105px;width:min(58px,78%)}.bar-detail{font-size:11px}}
  </style>

<body>
<main class="app">
  <header class="top"><div class="brand"><h1>🧩 数学对对碰</h1><p>翻开线索，碰出正确答案</p></div><button class="icon-btn" id="settingsBtn">⚙️ 设置</button></header>
  <section id="home" class="home-grid">
    <article class="panel hero"><h2>今天也来唤醒大脑吧！</h2><p>翻开两张含义相同的数学卡片完成配对。知识点短小直观，数字简单易算。</p><div class="label">知识难度</div><div class="choices" id="levels"><button class="choice active" data-value="basic">🌱 基础</button><button class="choice" data-value="advanced">🌿 进阶</button><button class="choice" data-value="challenge">🚀 挑战</button></div><div class="label">棋盘规模</div><div class="choices" id="sizes"><button class="choice active" data-value="3">3 × 3</button><button class="choice" data-value="4">4 × 4</button><button class="choice" data-value="5">5 × 5</button></div><button class="primary" id="startBtn">开始挑战 →</button></article>
    <aside class="panel side-card"><h3>📊 我的成长</h3><div class="stats"><div class="stat"><span class="muted">挑战次数</span><b id="totalGames">0</b></div><div class="stat"><span class="muted">平均得分</span><b id="averageScore">—</b></div><div class="stat"><span class="muted">最佳成绩</span><b id="bestScore">—</b></div><div class="stat"><span class="muted">连续打卡</span><b id="streak">0 天</b></div></div><button class="secondary" id="reportBtn" style="margin-top:14px">查看成长报告</button><div class="daily"><b>☀️ 每日挑战</b><div class="muted" id="dailyText">今天的固定题组正在等你</div><button class="primary" id="dailyBtn">开始今日挑战</button></div></aside>
  </section>
  <section id="game" class="game"><div class="game-head"><button class="secondary" id="backBtn">← 返回主页</button><div class="metrics"><span class="pill">⏱️ <b id="timer">00:00</b></span><span class="pill">👆 翻牌 <b id="moves">0</b></span><span class="pill">✅ 配对 <b id="pairs">0/0</b></span></div></div><div class="game-info"><div><b id="gameName">🌱 基础训练</b><span class="muted" id="gameDetail">翻开卡片开始游戏</span></div><div class="legend">寻找含义相同的两张卡片</div></div><div class="board" id="board" aria-label="数学记忆翻牌棋盘"></div><div class="game-actions"><button class="secondary" id="restartBtn">重新开始</button></div></section>
</main>
<dialog id="resultDialog"><div class="modal"><h2>🎉 挑战完成！</h2><div id="title" class="muted" style="text-align:center"></div><div class="result-score" id="finalScore">0</div><div class="result-grid"><div>翻牌<br><b id="finalMoves"></b></div><div>用时<br><b id="finalTime"></b></div><div>纪录<br><b id="recordText"></b></div></div><div class="modal-actions"><button class="secondary" onclick="resultDialog.close();goHome()">回到主页</button><button class="primary" onclick="resultDialog.close();startGame()">再玩一次</button></div></div></dialog>
<dialog id="reportDialog"><div class="modal"><h2>📈 成长报告</h2><p id="reportSummary" class="muted"></p><h3 class="report-section-title">各难度表现</h3><div id="difficultyChart" class="difficulty-chart" role="group" aria-label="基础、进阶和挑战难度的平均得分柱状图"></div><h3 class="report-section-title">最近记录</h3><div id="historyList" class="report-list"></div><div class="modal-actions"><button class="primary" onclick="reportDialog.close()">知道了</button></div></div></dialog>
<dialog id="settingsDialog"><div class="modal"><h2>⚙️ 设置</h2><label class="setting"><span>游戏音效</span><input type="checkbox" id="soundToggle" checked></label><label class="setting"><span>翻牌失败停留</span><select id="delaySelect"><option value="650">较快</option><option value="900" selected>标准</option><option value="1200">较慢</option></select></label><button class="secondary" id="resetData">清除本地记录</button><div class="modal-actions"><button class="primary" id="saveSettings">保存</button></div></div></dialog>
<div class="toast" id="toast"></div>
<script>
  // 三档仅表示游戏难度。第三项是抽题类型，用于避免同局出现过多同类题。
  const BANK={
    basic:[
      ["4 + 6 = ?","4 + 6 = 10","加法"],["7 + 8 = ?","7 + 8 = 15","加法"],["10 + 10 = ?","10 + 10 = 20","加法"],
      ["12 − 5 = ?","12 − 5 = 7","减法"],["16 − 8 = ?","16 − 8 = 8","减法"],["20 − 5 = ?","20 − 5 = 15","减法"],
      ["2 × 5 = ?","2 × 5 = 10","乘法"],["3 × 4 = ?","3 × 4 = 12","乘法"],["5 × 5 = ?","5 × 5 = 25","乘法"],
      ["10 ÷ 2 = ?","10 ÷ 2 = 5","除法"],["16 ÷ 2 = ?","16 ÷ 2 = 8","除法"],["20 ÷ 5 = ?","20 ÷ 5 = 4","除法"],
      ["1/2 = ?","1/2 = 50%","分数"],["1/4 = ?","1/4 = 25%","分数"],["0.2 = ?","0.2 = 1/5","分数"],
      ["正方形周长 = 4a","正方形周长 = 4a","公式"],["长方形面积 = ab","长方形面积 = ab","公式"],["三角形面积 = ah/2","三角形面积 = ah/2","公式"],
      ["2，4，6，?","2，4，6，8","规律"],["5，10，15，?","5，10，15，20","规律"],["10，20，30，?","10，20，30，40","规律"],
      ["相反数之和 = 0","相反数之和 = 0","概念"],["平均数 = 总数 ÷ 个数","平均数 = 总数 ÷ 个数","概念"]
    ],
    advanced:[
      ["|−6| = ?","|−6| = 6","有理数"],["−3 + 5 = ?","−3 + 5 = 2","有理数"],["−2 × (−4) = ?","−2 × (−4) = 8","有理数"],
      ["2³ = ?","2³ = 8","乘方"],["5² = ?","5² = 25","乘方"],["√36 = ?","√36 = 6","乘方"],
      ["x + 5 = 12","x + 5 = 12，x = 7","方程"],["2x = 16","2x = 16，x = 8","方程"],["x − 4 = 6","x − 4 = 6，x = 10","方程"],
      ["50% × 20 = ?","50% × 20 = 10","比例"],["25% × 20 = ?","25% × 20 = 5","比例"],["2∶5 = ?","2∶5 = 40%","比例"],
      ["勾股定理","a²+b²=c²","图形"],["圆周长","2πr","图形"],["圆面积","πr²","图形"],
      ["正比例函数","y=kx","函数"],["一次函数","y=kx+b","函数"],["反比例函数","y=k/x","函数"],
      ["平方差公式","a²−b²=(a+b)(a−b)","代数"],["同底数幂相乘","aᵐaⁿ=aᵐ⁺ⁿ","代数"],["零次幂","a⁰=1","代数"],
      ["概率","成功数 ÷ 总数","统计"],["极差","最大值 − 最小值","统计"],["中位数","中间的数据","统计"]
    ],
    challenge:[
      ["sin 30° = ?","sin 30° = 1/2","三角"],["tan 45° = ?","tan 45° = 1","三角"],["sin²A+cos²A = ?","sin²A+cos²A = 1","三角"],
      ["2，4，6，?","2，4，6，8","数列"],["2，4，8，?","2，4，8，16","数列"],["5，10，15，?","5，10，15，20","数列"],
      ["向量垂直","\\vec{a} · \\vec{b} = 0","向量"],["直线平行","k₁ = k₂","向量"],["直线垂直","k₁k₂ = −1","向量"],
      ["偶函数","f(−x)=f(x)","函数"],["奇函数","f(−x)=−f(x)","函数"],["函数零点","f(x)=0","函数"],
      ["圆心 (0,0)，r=2","圆：x²+y²=4","坐标"],["(0,0) 到 (3,4)","两点距离 = 5","坐标"],["中点公式","两坐标分别平均","坐标"],
      ["对立事件","P(Ā)=1−P(A)","概率"],["必然事件概率 = ?","必然事件概率 = 1","概率"],["不可能事件概率 = ?","不可能事件概率 = 0","概率"],
      ["复数单位","i²=−1","复数"],["a+bi 的共轭","共轭复数 = a−bi","复数"],["纯实数的虚部","虚部 = 0","复数"],
      ["x² 的导数","(x²)' = 2x","导数"],["x³ 的导数","(x³)' = 3x²","导数"],["常数的导数","常数的导数 = 0","导数"]
    ]
  };
  const home=document.getElementById("home"),game=document.getElementById("game"),board=document.getElementById("board"),timer=document.getElementById("timer"),movesNode=document.getElementById("moves"),pairs=document.getElementById("pairs"),gameName=document.getElementById("gameName"),gameDetail=document.getElementById("gameDetail"),startBtn=document.getElementById("startBtn"),dailyBtn=document.getElementById("dailyBtn"),backBtn=document.getElementById("backBtn"),restartBtn=document.getElementById("restartBtn"),settingsBtn=document.getElementById("settingsBtn"),settingsDialog=document.getElementById("settingsDialog"),soundToggle=document.getElementById("soundToggle"),delaySelect=document.getElementById("delaySelect"),saveSettings=document.getElementById("saveSettings"),resetData=document.getElementById("resetData"),reportBtn=document.getElementById("reportBtn"),reportDialog=document.getElementById("reportDialog"),reportSummary=document.getElementById("reportSummary"),difficultyChart=document.getElementById("difficultyChart"),historyList=document.getElementById("historyList"),resultDialog=document.getElementById("resultDialog"),finalScore=document.getElementById("finalScore"),finalMoves=document.getElementById("finalMoves"),finalTime=document.getElementById("finalTime"),recordText=document.getElementById("recordText"),resultTitle=document.getElementById("title"),totalGames=document.getElementById("totalGames"),averageScore=document.getElementById("averageScore"),bestScore=document.getElementById("bestScore"),streak=document.getElementById("streak"),dailyText=document.getElementById("dailyText"),toast=document.getElementById("toast");
  const KEY="memoryStationUserV2";let data=load(),level="basic",size=3,daily=false,cards=[],first=null,lock=false,moves=0,matched=0,startAt=0,tick=null;
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||{history:[],settings:{sound:true,delay:900},daily:[]}}catch{return{history:[],settings:{sound:true,delay:900},daily:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}
  function seeded(seed){let x=seed;return()=>((x=Math.imul(48271,x)%2147483647)&2147483647)/2147483647}function shuffle(a,r=Math.random){for(let i=a.length-1;i;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function selectPairs(group,count,rng=Math.random){const selected=[],usedText=new Set(),usedType=new Map(),pool=shuffle([...group],rng),types=new Set(group.map(pair=>pair[2])).size,maxPerType=Math.max(1,Math.ceil(count/types));for(let limit=1;limit<=maxPerType;limit++){for(const pair of pool){if(selected.includes(pair)||(usedType.get(pair[2])||0)>=limit)continue;const normalized=pair.slice(0,2).map(text=>String(text).replace(/\s+/g,"").toLowerCase());if(normalized.some(text=>usedText.has(text)))continue;selected.push(pair);normalized.forEach(text=>usedText.add(text));usedType.set(pair[2],(usedType.get(pair[2])||0)+1);if(selected.length===count)return selected}}return selected}
  document.querySelectorAll(".choices").forEach(g=>g.onclick=e=>{if(!e.target.dataset.value)return;g.querySelectorAll("button").forEach(b=>b.classList.remove("active"));e.target.classList.add("active");if(g.id==="levels")level=e.target.dataset.value;else size=+e.target.dataset.value});
  function startGame(isDaily=daily){daily=isDaily;clearInterval(tick);moves=matched=0;first=null;lock=false;const cells=size*size,pairCount=Math.floor(cells/2),rng=daily?dateRand():Math.random,source=selectPairs(BANK[level],pairCount,rng);cards=[];source.forEach((p,i)=>{const same=p[0]===p[1],leftKind=same?"公式":"题目",rightKind=same?"公式":"答案";cards.push({id:i,text:p[0],kind:leftKind,type:p[2]},{id:i,text:p[1],kind:rightKind,type:p[2]})});if(cells%2)cards.push({id:"star",text:"⭐ 幸运星",kind:"奖励",type:"奖励",lucky:true});shuffle(cards,daily?dateRand():Math.random);render();home.style.display="none";game.style.display="block";startAt=Date.now();tick=setInterval(updateTime,500);sound(330,.05)}
  function dateRand(){const d=new Date(),seed=+(d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"))+size*97+level.length*31;return seeded(seed)}
  function setMathText(node,text){const pattern=/\\vec\{([A-Za-z])\}/g;let last=0,match;while((match=pattern.exec(text))){node.append(document.createTextNode(text.slice(last,match.index)));const vector=document.createElement("span");vector.className="vector-letter";vector.textContent=match[1];vector.setAttribute("aria-label",`${match[1]}向量`);node.append(vector);last=pattern.lastIndex}node.append(document.createTextNode(text.slice(last)))}
  function render(){const levelNames={basic:"🌱 基础训练",advanced:"🌿 进阶训练",challenge:"🚀 挑战训练"},typeCount=new Set(cards.filter(c=>!c.lucky).map(c=>c.type)).size;board.innerHTML="";board.dataset.size=size;board.style.gridTemplateColumns=`repeat(${size},1fr)`;gameName.textContent=daily?"☀️ 今日挑战":levelNames[level];gameDetail.textContent=`${size} × ${size} 棋盘 · ${Math.floor(cards.length/2)} 组配对 · ${typeCount} 类内容${cards.length%2?" + 幸运星":""}`;cards.forEach(c=>{const el=document.createElement("button"),plainText=c.text.replace(/\\vec\{([A-Za-z])\}/g,"$1"),length=[...plainText].length,sizeClass=length>13?" very-long":length>9?" long":"";el.type="button";el.className="memory-card"+(c.lucky?" lucky":"");el.setAttribute("aria-label","未翻开的数学卡片");el.innerHTML=`<span class="inner"><span class="face back"><span>?</span><small>数学卡片</small></span><span class="face front"><span class="card-label">${c.kind}</span><span class="card-content${sizeClass}"></span></span></span>`;setMathText(el.querySelector(".card-content"),c.text);el.onclick=()=>flip(el,c);board.append(el)});movesEl();pairs.textContent=`0/${Math.ceil(cards.length/2)}`;timer.textContent="00:00"}
  function flip(el,c){if(lock||el.classList.contains("flipped")||el.classList.contains("matched"))return;el.classList.add("flipped");moves++;movesEl();sound(430,.035);if(c.lucky){el.classList.add("matched");matched++;sound(760,.08);checkDone();return}if(!first){first={el,c};return}lock=true;if(first.c.id===c.id){setTimeout(()=>{first.el.classList.add("matched");el.classList.add("matched");matched++;first=null;lock=false;sound(720,.1);checkDone()},300)}else setTimeout(()=>{first.el.classList.remove("flipped");el.classList.remove("flipped");first=null;lock=false;sound(180,.07)},data.settings.delay)}
  function movesEl(){movesNode.textContent=moves}function updateTime(){const s=Math.floor((Date.now()-startAt)/1000);timer.textContent=fmt(s)}function fmt(s){return `${String(s/60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
  function checkDone(){pairs.textContent=`${matched}/${Math.ceil(cards.length/2)}`;if(matched<Math.ceil(cards.length/2))return;clearInterval(tick);const seconds=Math.max(1,Math.floor((Date.now()-startAt)/1000)),ideal=cards.length,accuracy=Math.min(1,ideal/moves),target={3:35,4:75,5:130}[size],speed=Math.min(1,target/seconds),score=Math.round((accuracy*.7+speed*.3)*1000),oldBest=Math.max(0,...data.history.map(x=>x.score)),record=score>oldBest;data.history.unshift({date:new Date().toISOString(),level,size,moves,seconds,score,daily});data.history=data.history.slice(0,50);if(daily){const day=new Date().toISOString().slice(0,10);if(!data.daily.includes(day))data.daily.push(day)}save();sound(900,.28);setTimeout(()=>showResult(score,seconds,record),500)}
  function showResult(score,seconds,record){finalScore.textContent=score;finalMoves.textContent=moves+" 次";finalTime.textContent=fmt(seconds);recordText.textContent=record?"🏆 新纪录":"继续加油";resultTitle.textContent=score>=900?"🌟 记忆大师":score>=750?"✨ 精准观察者":"🌱 坚持练习者";resultDialog.showModal()}
  function goHome(){clearInterval(tick);game.style.display="none";home.style.display="grid";daily=false;refreshStats()}function refreshStats(){const h=data.history,total=h.length,avg=total?Math.round(h.reduce((a,b)=>a+b.score,0)/total):0,best=total?Math.max(...h.map(x=>x.score)):0;totalGames.textContent=total;averageScore.textContent=total?avg:"—";bestScore.textContent=total?best:"—";streak.textContent=calcStreak()+" 天";const today=new Date().toISOString().slice(0,10),done=data.daily.includes(today);dailyText.textContent=done?"✅ 今日挑战已完成":"今天的固定题组正在等你";dailyBtn.textContent=done?"再次挑战":"开始今日挑战"}
  function calcStreak(){const set=new Set(data.daily),d=new Date();let n=0;for(;;){const k=d.toISOString().slice(0,10);if(!set.has(k))break;n++;d.setDate(d.getDate()-1)}return n}
  function sound(freq,dur){if(!data.settings.sound)return;try{const ac=new (AudioContext||webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch{}}
  startBtn.onclick=()=>startGame(false);dailyBtn.onclick=()=>{daily=true;startGame(true)};backBtn.onclick=goHome;restartBtn.onclick=()=>startGame(daily);settingsBtn.onclick=()=>{soundToggle.checked=data.settings.sound;delaySelect.value=data.settings.delay;settingsDialog.showModal()};saveSettings.onclick=()=>{data.settings.sound=soundToggle.checked;data.settings.delay=+delaySelect.value;save();settingsDialog.close();toastMsg("设置已保存")};resetData.onclick=()=>{if(confirm("确定清除所有成绩与打卡记录吗？")){data={history:[],settings:data.settings,daily:[]};save();refreshStats();settingsDialog.close();toastMsg("记录已清除")}};
  function renderDifficultyChart(h){const levels=[{key:"basic",label:"基础",tone:"basic"},{key:"advanced",label:"进阶",tone:"advanced"},{key:"challenge",label:"挑战",tone:"challenge"}];difficultyChart.innerHTML=levels.map(item=>{const rows=h.filter(x=>x.level===item.key),count=rows.length,avg=count?Math.round(rows.reduce((sum,x)=>sum+x.score,0)/count):0,best=count?Math.max(...rows.map(x=>x.score)):0,height=count?Math.max(6,Math.min(100,avg/10)):0,label=count?`${item.label}难度：${count}局，平均${avg}分，最佳${best}分`:`${item.label}难度：暂无记录`;return `<div class="difficulty-column" role="img" aria-label="${label}"><div class="bar-value">${count?avg:"—"}</div><div class="bar-track" aria-hidden="true"><div class="bar-fill ${item.tone}" style="height:${height}%"></div></div><strong class="bar-label">${item.label}</strong><small class="bar-detail">${count?`${count} 局 · 最佳 ${best}`:"暂无记录"}</small></div>`}).join("")}
  reportBtn.onclick=()=>{const h=data.history;reportSummary.textContent=h.length?`你已完成 ${h.length} 次挑战，平均得分 ${Math.round(h.reduce((a,b)=>a+b.score,0)/h.length)}。继续保持！`:"完成第一局游戏后，这里会显示你的成长轨迹。";renderDifficultyChart(h);historyList.innerHTML=h.length?h.slice(0,12).map(x=>`<div class="history"><span>${new Date(x.date).toLocaleDateString()} · ${{basic:"基础",advanced:"进阶",challenge:"挑战"}[x.level]} ${x.size}×${x.size}</span><b>${x.score} 分</b></div>`).join(""):"<p class='muted'>暂无记录</p>";reportDialog.showModal()};function toastMsg(s){toast.textContent=s;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1600)}refreshStats();
  window.goHome=goHome;window.startGame=startGame;
</script>
