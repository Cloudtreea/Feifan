services:
  - type: web
    name: history-match-demo
    runtime: python
    plan: free
    buildCommand: pip install --retries 8 --timeout 60 -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.4
      - key: DATABASE_URL
        fromDatabase:
          name: history-match-db
          property: connectionString
      - key: DEMO_ADMIN_KEY
        generateValue: true

databases:
  - name: history-match-db
    plan: free
    databaseName: history_match
    user: history_match
